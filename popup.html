<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnPro - AI Prompt Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6 w-96 rounded-lg shadow-lg">
    <div class="flex flex-col items-center space-y-4">
        <h1 class="text-xl font-bold text-green-400">EnPro - AI Prompt Enhancer</h1>

        <textarea id="user-input" class="w-full p-3 rounded-md bg-gray-800 text-white border border-gray-700 focus:ring-2 focus:ring-green-400" 
                  placeholder="Enter your prompt..."></textarea>
        
        <button id="enhance-btn" class="w-full py-2 px-4 bg-green-500 text-white font-semibold rounded-lg hover:bg-green-600 transition">
            Enhance Prompt
        </button>

        <textarea id="enhanced-output" class="w-full p-3 rounded-md bg-gray-800 text-white border border-gray-700 focus:ring-2 focus:ring-green-400" readonly></textarea>

        <button id="copy-btn" class="w-full py-2 px-4 bg-blue-500 text-white font-semibold rounded-lg hover:bg-blue-600 transition">
            Copy to Clipboard
        </button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
