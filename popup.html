<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnPro - AI Prompt Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex items-center justify-center bg-gray-900 w-[400px] h-[250px] rounded-2xl p-4">
    <div class="w-full flex flex-col items-center space-y-3">
        <h2 class="text-lg font-semibold text-white">EnPro - AI Prompt Enhancer</h2>

        <textarea id="user-input" placeholder="Enter your prompt..."
            class="w-full p-2 bg-gray-800 text-white rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        ></textarea>

        <button id="enhance-btn"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-lg transition duration-300"
        >Enhance Text</button>

        <textarea id="enhanced-output" readonly placeholder="Enhanced output..."
            class="w-full p-2 bg-gray-800 text-white rounded-lg border border-gray-700 focus:outline-none"
        ></textarea>

        <button id="copy-btn"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-lg transition duration-300"
        >Copy Enhanced Text</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
