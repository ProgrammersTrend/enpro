<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnPro - AI Prompt Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 w-80">

    <div class="flex flex-col space-y-4">
        <h2 class="text-lg font-semibold text-center">EnPro - AI Prompt Enhancer</h2>

        <textarea id="user-input" placeholder="Enter your prompt..."
            class="w-full p-3 bg-gray-800 text-white rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        ></textarea>

        <button id="enhance-btn"
            class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 rounded-lg transition duration-300"
        >Enhance Prompt</button>

        <textarea id="enhanced-output" readonly placeholder="Enhanced output..."
            class="w-full p-3 bg-gray-800 text-white rounded-lg border border-gray-700 focus:outline-none"
        ></textarea>

        <h3 class="text-sm font-semibold">Possible Suggestions:</h3>
        <ul id="suggestions-list" class="space-y-2"></ul>

        <button id="copy-btn"
            class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-lg transition duration-300"
        >Copy to Clipboard</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
